name: FP Platform reference input proposal

on:
  pull_request:
    paths:
      - 'integrations/wordpress/fp-platform-pilot/input-normalization/**'
      - 'integrations/wordpress/fp-platform-pilot/source-recovery/**'
      - '.github/workflows/fp-platform-input-normalization.yml'
  push:
    branches: ['codex/fp-reference-input-normalization']
    paths:
      - 'integrations/wordpress/fp-platform-pilot/input-normalization/**'
      - 'integrations/wordpress/fp-platform-pilot/source-recovery/**'
      - '.github/workflows/fp-platform-input-normalization.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned archive, build scratch candidate and regress input paths
        run: python3 integrations/wordpress/fp-platform-pilot/input-normalization/test.py
