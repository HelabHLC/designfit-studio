name: Reference Engine WordPress source

on:
  pull_request:
    paths:
      - 'integrations/wordpress/arbe-hlc-reference-engine/**'
      - '.github/workflows/reference-engine-wordpress.yml'
  push:
    paths:
      - 'integrations/wordpress/arbe-hlc-reference-engine/**'
      - '.github/workflows/reference-engine-wordpress.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP source
        run: |
          find integrations/wordpress/arbe-hlc-reference-engine -name '*.php' -print0 |
            xargs -0 -n1 php -l
      - name: Exercise parser and importer gates
        run: php integrations/wordpress/arbe-hlc-reference-engine/tests/importer_and_parser.php
      - name: Check JavaScript syntax
        run: |
          node --check integrations/wordpress/arbe-hlc-reference-engine/assets/js/frontend.js
          node --check integrations/wordpress/arbe-hlc-reference-engine/assets/js/admin.js
      - name: Validate released runtime dataset and provenance
        run: |
          cd integrations/wordpress/arbe-hlc-reference-engine
          python tools/validate_runtime_master.py
          echo '9baa2cdfe75e3489fc94bc92377f5b0509f2f5688a279d92c1201559757f7fd4  data/runtime-master-v1.csv' | sha256sum -c -
          test -f data/RELEASE_NOTICE.md
          test -f data/runtime-master-v1.release-manifest.json
